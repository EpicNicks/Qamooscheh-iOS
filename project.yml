name: Qamooscheh
options:
  bundleIdPrefix: com.parsling
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
packages:
  QDesign:
    path: Packages/QDesign
  QFeatures:
    path: Packages/QFeatures
  SnapshotTesting:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    exactVersion: 1.17.6
targets:
  Qamooscheh:
    type: application
    platform: iOS
    sources:
      - App/Sources
    dependencies:
      - package: QDesign
      - package: QFeatures
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: Qamooscheh
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.parsling.ios.dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.parsling.ios
  QamooschehTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - App/Tests
    dependencies:
      - target: Qamooscheh
      - package: SnapshotTesting
    settings:
      base:
        GENERATE_INFOPLIST_FILE: "YES"
        PRODUCT_BUNDLE_IDENTIFIER: com.parsling.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Qamooscheh.app/Qamooscheh"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Qamooscheh:
    build:
      targets:
        Qamooscheh: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - QamooschehTests
