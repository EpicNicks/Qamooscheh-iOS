name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single place that pins the macOS image and Xcode. The simulator is
  # picked on the runner from runtimes matching the selected Xcode's iOS SDK.
  # Xcode 16.4 (iOS 18.5 SDK) is installed on the macos-15 image with a matching runtime.
  config:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pin.outputs.runner }}
      xcode: ${{ steps.pin.outputs.xcode }}
    steps:
      - id: pin
        run: |
          echo "runner=macos-15" >> "$GITHUB_OUTPUT"
          echo "xcode=16.4" >> "$GITHUB_OUTPUT"

  packages:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [QModel, QDomain, QNetwork, QData, QGrader, QDesign, QKeyboard, QFeatures]
    steps:
      - uses: actions/checkout@v4
      - name: select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ needs.config.outputs.xcode }}.app
          ls /Applications | grep Xcode
          xcodebuild -version
          xcodebuild -showsdks
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ needs.config.outputs.xcode }}.app
          ls /Applications | grep Xcode
          xcodebuild -version
          xcodebuild -showsdks
      - name: pick simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          SDKVER=$(xcodebuild -showsdks | grep -Eo 'iphonesimulator[0-9]+(\.[0-9]+)?' | head -n 1 | sed 's/iphonesimulator//')
          echo "Selected Xcode iOS simulator SDK: $SDKVER"
          if [ -z "$SDKVER" ]; then echo "no iOS simulator SDK"; exit 1; fi
          UDID=$(xcrun simctl list devices available | awk -v ver="$SDKVER" '/^-- /{insec = ($0 == "-- iOS " ver " --")} insec && /iPhone/' | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then echo "no available iPhone simulator for iOS $SDKVER"; exit 1; fi
          echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          echo "Chosen destination: platform=iOS Simulator,id=$UDID (iOS $SDKVER)"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Qamooscheh.xcodeproj -scheme Qamooscheh \
            -destination "$DEST" \
            -resultBundlePath build/app.xcresult CODE_SIGNING_ALLOWED=NO
      - name: test
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Qamooscheh.xcodeproj -scheme Qamooscheh \
            -destination "$DEST" \
            -skip-testing:QamooschehTests/ShellSnapshotTests \
            -resultBundlePath build/app-test.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-xcresult
          path: build/*.xcresult

  snapshots:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_${{ needs.config.outputs.xcode }}.app
          ls /Applications | grep Xcode
          xcodebuild -version
          xcodebuild -showsdks
      - name: pick simulator
        run: |
          xcrun simctl list runtimes
          xcrun simctl list devices available
          SDKVER=$(xcodebuild -showsdks | grep -Eo 'iphonesimulator[0-9]+(\.[0-9]+)?' | head -n 1 | sed 's/iphonesimulator//')
          echo "Selected Xcode iOS simulator SDK: $SDKVER"
          if [ -z "$SDKVER" ]; then echo "no iOS simulator SDK"; exit 1; fi
          UDID=$(xcrun simctl list devices available | awk -v ver="$SDKVER" '/^-- /{insec = ($0 == "-- iOS " ver " --")} insec && /iPhone/' | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then echo "no available iPhone simulator for iOS $SDKVER"; exit 1; fi
          echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          echo "Chosen destination: platform=iOS Simulator,id=$UDID (iOS $SDKVER)"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: snapshot tests
        run: |
          set -o pipefail
          xcodebuild test -project Qamooscheh.xcodeproj -scheme Qamooscheh \
            -destination "$DEST" \
            -only-testing:QamooschehTests/ShellSnapshotTests \
            -resultBundlePath build/snapshots.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: App/Tests/__Snapshots__/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshots-xcresult
          path: build/*.xcresult

  # M1 spike: the same QGrader fixture suite on an iOS simulator (JavaScriptCore and WKWebView
  # in an iOS process), so the recorded timings are not macOS-host-only.
  grader-sim:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: select Xcode
        run: sudo xcode-select -s /Applications/Xcode_${{ needs.config.outputs.xcode }}.app
      - name: pick simulator
        run: |
          SDKVER=$(xcodebuild -showsdks | grep -Eo 'iphonesimulator[0-9]+(\.[0-9]+)?' | head -n 1 | sed 's/iphonesimulator//')
          UDID=$(xcrun simctl list devices available | awk -v ver="$SDKVER" '/^-- /{insec = ($0 == "-- iOS " ver " --")} insec && /iPhone/' | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then echo "no available iPhone simulator for iOS $SDKVER"; exit 1; fi
          echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
      - name: QGrader tests on simulator
        working-directory: Packages/QGrader
        run: |
          set -o pipefail
          xcodebuild test -scheme QGrader -destination "$DEST" CODE_SIGNING_ALLOWED=NO | tee ../../grader-sim.log | grep -E "QGRADER-SPIKE|error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)"
      # Non-gating: WKWebView is only the fallback runtime and its simulator cold start is erratic on CI
      # (see docs/grader-spike.md). Still run so every run records whether it started and its timings.
      - name: WKWebView tests on simulator (non-gating)
        continue-on-error: true
        working-directory: Packages/QGrader
        env:
          TEST_RUNNER_QGRADER_WEBVIEW_FIXTURES: "1"
        run: |
          set -o pipefail
          xcodebuild test -scheme QGrader -destination "$DEST" CODE_SIGNING_ALLOWED=NO -only-testing:QGraderTests/WebViewGraderTests | tee ../../grader-sim-webview.log | grep -E "QGRADER-SPIKE|error:|Test Case|Executed|TEST (SUCCEEDED|FAILED)"
