name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The single place that pins the macOS image and Xcode. The simulator is
  # picked dynamically on the runner (first available iPhone) and logged.
  config:
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pin.outputs.runner }}
      xcode: ${{ steps.pin.outputs.xcode }}
    steps:
      - id: pin
        run: |
          echo "runner=macos-15" >> "$GITHUB_OUTPUT"
          echo "xcode=16.2" >> "$GITHUB_OUTPUT"

  packages:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        package: [QModel, QDomain, QNetwork, QData, QGrader, QDesign, QKeyboard, QFeatures]
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_${{ needs.config.outputs.xcode }}.app
      - name: swift test
        working-directory: Packages/${{ matrix.package }}
        run: swift test

  app:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_${{ needs.config.outputs.xcode }}.app
      - name: pick simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then echo "no available iPhone simulator"; exit 1; fi
          echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          echo "Chosen destination: platform=iOS Simulator,id=$UDID"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: build for testing
        run: |
          set -o pipefail
          xcodebuild build-for-testing -project Qamooscheh.xcodeproj -scheme Qamooscheh \
            -destination "$DEST" \
            -resultBundlePath build/app.xcresult CODE_SIGNING_ALLOWED=NO
      - name: test
        run: |
          set -o pipefail
          xcodebuild test-without-building -project Qamooscheh.xcodeproj -scheme Qamooscheh \
            -destination "$DEST" \
            -skip-testing:QamooschehTests/ShellSnapshotTests \
            -resultBundlePath build/app-test.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: app-xcresult
          path: build/*.xcresult

  snapshots:
    needs: config
    runs-on: ${{ needs.config.outputs.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo xcode-select -s /Applications/Xcode_${{ needs.config.outputs.xcode }}.app
      - name: pick simulator
        run: |
          xcrun simctl list devices available
          UDID=$(xcrun simctl list devices available iPhone | grep -Eo '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}' | head -n 1)
          if [ -z "$UDID" ]; then echo "no available iPhone simulator"; exit 1; fi
          echo "DEST=platform=iOS Simulator,id=$UDID" >> "$GITHUB_ENV"
          echo "Chosen destination: platform=iOS Simulator,id=$UDID"
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: snapshot tests
        run: |
          set -o pipefail
          xcodebuild test -project Qamooscheh.xcodeproj -scheme Qamooscheh \
            -destination "$DEST" \
            -only-testing:QamooschehTests/ShellSnapshotTests \
            -resultBundlePath build/snapshots.xcresult CODE_SIGNING_ALLOWED=NO
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: App/Tests/__Snapshots__/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: snapshots-xcresult
          path: build/*.xcresult
